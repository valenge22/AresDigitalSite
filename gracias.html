<body><main class="card"><img class="logo" src="assets/ares-logo-128.png" alt="ARES Digital"><div class="eyebrow">Consulta recibida</div><h1>Gracias por contarnos tu proyecto.</h1><p>Revisaremos la información y te responderemos personalmente para conversar los próximos pasos.</p><a href="https://aresdigital.site/">Volver a ARES Digital</a></main></body>
